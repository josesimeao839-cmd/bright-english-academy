<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="robots"
          content="noindex, follow">

    <meta http-equiv="refresh"
          content="3; url=https://josesimeao839-cmd.github.io/bright-english-academy-new/">

    <link rel="canonical"
          href="https://josesimeao839-cmd.github.io/bright-english-academy-new/">

    <title>Bright English Academy — Moving</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef7ff,
                    #ffffff
                );

            color: #17233c;

            text-align: center;
        }

        .container {
            width: min(90%, 600px);

            background: white;

            padding: 45px 30px;

            border-radius: 24px;

            box-shadow:
                0 20px 50px
                rgba(20,53,100,.12);
        }

        .icon {
            font-size: 60px;

            margin-bottom: 15px;
        }

        h1 {
            color: #0757c9;

            margin-bottom: 12px;
        }

        p {
            color: #64748b;

            line-height: 1.6;
        }

        .btn {
            display: inline-block;

            margin-top: 20px;

            padding: 14px 25px;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #0757c9,
                    #13a6e8
                );

            color: white;

            text-decoration: none;

            font-weight: bold;
        }

        .small {
            margin-top: 20px;

            font-size: 13px;

            color: #94a3b8;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="icon">
            📚
        </div>

        <h1>
            Bright English Academy
        </h1>

        <p>
            We have moved to our new website.
        </p>

        <p>
            You will be redirected automatically
            to the new Bright English Academy
            website in a few seconds.
        </p>

        <a
            href="https://josesimeao839-cmd.github.io/bright-english-academy-new/"
            class="btn">

            🚀 Go to New Website

        </a>

        <p class="small">
            If you are not redirected automatically,
            click the button above.
        </p>

    </div>

</body>

</html>
