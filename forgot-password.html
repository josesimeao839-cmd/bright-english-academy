<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Reset your Bright English Academy student password.">

    <title>Reset Password | Bright English Academy</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0b4f9c,
                    #1d78d4
                );

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        .container {

            width: 100%;

            max-width: 450px;

            background: white;

            padding: 40px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.20);
        }


        .logo {

            text-align: center;

            font-size: 28px;

            font-weight: bold;

            color: #0b4f9c;

            margin-bottom: 10px;
        }


        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 30px;
        }


        h1 {

            text-align: center;

            color: #222;

            font-size: 25px;

            margin-bottom: 15px;
        }


        .description {

            text-align: center;

            color: #666;

            line-height: 1.6;

            margin-bottom: 25px;
        }


        label {

            display: block;

            margin-top: 18px;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }


        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }


        input:focus {

            border-color: #0b4f9c;

            box-shadow:
                0 0 0 2px
                rgba(11, 79, 156, 0.10);
        }


        /* PASSWORD */

        .password-wrapper {

            position: relative;

            width: 100%;
        }


        .password-wrapper input {

            padding-right: 50px;
        }


        .toggle-password {

            position: absolute;

            right: 8px;

            top: 50%;

            transform:
                translateY(-50%);

            width: auto;

            margin: 0;

            padding: 7px;

            border: none;

            background: transparent;

            color: #0b4f9c;

            font-size: 20px;

            cursor: pointer;

            box-shadow: none;
        }


        .toggle-password:hover {

            background: transparent;

            color: #083b75;
        }


        /* BUTTON */

        .main-button {

            width: 100%;

            padding: 14px;

            margin-top: 25px;

            border: none;

            border-radius: 8px;

            background: #0b4f9c;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .main-button:hover {

            background: #083b75;
        }


        .main-button:disabled {

            background: #999;

            cursor: not-allowed;
        }


        /* MESSAGE */

        #message {

            margin-top: 20px;

            text-align: center;

            font-weight: bold;

            line-height: 1.5;
        }


        .success {

            color: #16803c;
        }


        .error {

            color: #c62828;
        }


        /* RESET SECTION */

        #resetSection {

            display: none;
        }


        /* LINKS */

        .links {

            text-align: center;

            margin-top: 25px;
        }


        .links a {

            color: #0b4f9c;

            text-decoration: none;

            font-weight: bold;
        }


        .links a:hover {

            text-decoration: underline;
        }


        .home-link {

            display: block;

            margin-top: 15px;

            color: #666 !important;

            font-weight: normal !important;
        }


        @media (max-width: 500px) {

            .container {

                padding: 30px 22px;
            }


            .logo {

                font-size: 24px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">

        Bright English Academy

    </div>


    <div class="subtitle">

        Speak English with Confidence

    </div>


    <!-- RECOVERY -->

    <div id="recoverySection">


        <h1>

            Forgot Password?

        </h1>


        <p class="description">

            Enter your email address and we will
            send you a link to reset your password.

        </p>


        <form id="recoveryForm">


            <label for="email">

                Email

            </label>


            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >


            <button
                type="submit"
                id="recoveryButton"
                class="main-button">

                Send Reset Link

            </button>


        </form>


    </div>


    <!-- RESET PASSWORD -->

    <div id="resetSection">


        <h1>

            Create New Password

        </h1>


        <p class="description">

            Enter your new password below.

        </p>


        <form id="resetForm">


            <label for="newPassword">

                New Password

            </label>


            <div class="password-wrapper">


                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >


                <button
                    type="button"
                    id="toggleNewPassword"
                    class="toggle-password">

                    👁️

                </button>


            </div>


            <label for="confirmPassword">

                Confirm New Password

            </label>


            <div class="password-wrapper">


                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >


                <button
                    type="button"
                    id="toggleConfirmPassword"
                    class="toggle-password">

                    👁️

                </button>


            </div>


            <button
                type="submit"
                id="resetButton"
                class="main-button">

                Update Password

            </button>


        </form>


    </div>


    <!-- MESSAGE -->

    <div id="message"></div>


    <!-- LINKS -->

    <div class="links">


        <a href="login.html">

            ← Back to Login

        </a>


        <a
            href="index.html"
            class="home-link">

            ← Back to Home

        </a>


    </div>


</div>


<script type="module">


    /*
     * SUPABASE
     */

    import {
        createClient
    }

    from
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    /*
     * PROJECT URL
     */

    const SUPABASE_URL =
        "https://atjyyhlqqwyilddcstjp.supabase.co";


    /*
     * PUBLISHABLE KEY
     *
     * Use a tua Publishable Key.
     */

    const SUPABASE_KEY =
        "COLOCA_AQUI_A_TUA_PUBLISHABLE_KEY";


    /*
     * SUPABASE CLIENT
     */

    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /*
     * ELEMENTS
     */

    const recoverySection =
        document.getElementById(
            "recoverySection"
        );


    const resetSection =
        document.getElementById(
            "resetSection"
        );


    const recoveryForm =
        document.getElementById(
            "recoveryForm"
        );


    const resetForm =
        document.getElementById(
            "resetForm"
        );


    const recoveryButton =
        document.getElementById(
            "recoveryButton"
        );


    const resetButton =
        document.getElementById(
            "resetButton"
        );


    const message =
        document.getElementById(
            "message"
        );


    const newPassword =
        document.getElementById(
            "newPassword"
        );


    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        );


    /*
     * SHOW / HIDE NEW PASSWORD
     */

    document
        .getElementById(
            "toggleNewPassword"
        )
        .addEventListener(
            "click",
            function() {


                if (
                    newPassword.type ===
                    "password"
                ) {


                    newPassword.type =
                        "text";


                    this.textContent =
                        "🙈";


                }

                else {


                    newPassword.type =
                        "password";


                    this.textContent =
                        "👁️";

                }

            }
        );


    /*
     * SHOW / HIDE CONFIRM PASSWORD
     */

    document
        .getElementById(
            "toggleConfirmPassword"
        )
        .addEventListener(
            "click",
            function() {


                if (
                    confirmPassword.type ===
                    "password"
                ) {


                    confirmPassword.type =
                        "text";


                    this.textContent =
                        "🙈";


                }

                else {


                    confirmPassword.type =
                        "password";


                    this.textContent =
                        "👁️";

                }

            }
        );


    /*
     * SEND RECOVERY EMAIL
     */

    recoveryForm.addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();


            const email =
                document
                .getElementById("email")
                .value
                .trim();


            recoveryButton.disabled =
                true;


            recoveryButton.textContent =
                "Sending...";


            message.className = "";


            message.textContent =
                "Sending password reset link...";


            const {
                error
            } =
            await supabase.auth
            .resetPasswordForEmail(
                email,
                {

                    redirectTo:
                        window.location.origin +
                        window.location.pathname

                }
            );


            if (error) {


                message.className =
                    "error";


                message.textContent =
                    "Error: " +
                    error.message;


                recoveryButton.disabled =
                    false;


                recoveryButton.textContent =
                    "Send Reset Link";


                return;

            }


            message.className =
                "success";


            message.textContent =
                "Password reset link sent. Check your email.";


            recoveryButton.disabled =
                false;


            recoveryButton.textContent =
                "Send Reset Link";

        }
    );


    /*
     * DETECT PASSWORD RESET SESSION
     */

    supabase.auth.onAuthStateChange(
        function(event, session) {


            if (
                event ===
                "PASSWORD_RECOVERY"
            ) {


                recoverySection.style.display =
                    "none";


                resetSection.style.display =
                    "block";


                message.textContent = "";

            }

        }
    );


    /*
     * UPDATE PASSWORD
     */

    resetForm.addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();


            const password =
                newPassword.value;


            const confirmation =
                confirmPassword.value;


            if (
                password !==
                confirmation
            ) {


                message.className =
                    "error";


                message.textContent =
                    "The passwords do not match.";


                return;

            }


            if (
                password.length < 6
            ) {


                message.className =
                    "error";


                message.textContent =
                    "Password must contain at least 6 characters.";


                return;

            }


            resetButton.disabled =
                true;


            resetButton.textContent =
                "Updating...";


            const {
                error
            } =
            await supabase.auth
            .updateUser({

                password:
                    password

            });


            if (error) {


                message.className =
                    "error";


                message.textContent =
                    "Error: " +
                    error.message;


                resetButton.disabled =
                    false;


                resetButton.textContent =
                    "Update Password";


                return;

            }


            message.className =
                "success";


            message.textContent =
                "Password updated successfully!";


            setTimeout(
                function() {

                    window.location.href =
                        "login.html";

                },
                1500
            );

        }
    );


</script>


</body>

</html>
