<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | Bright English Academy</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f9ff;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 450px;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        }

        h1 {
            text-align: center;
            color: #0b4f9c;
        }

        p {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #0b4f9c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #083b75;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Bright English Academy</h1>

    <p>Create your student account</p>

    <form id="registerForm">

        <label for="name">
            Full Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
        >

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Create a password"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <div id="message"></div>

    <a href="index.html" class="back">
        ← Back to Home
    </a>

</div>


<script type="module">

    import { createClient }
    from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


    const SUPABASE_URL =
        "https://atjyyhlqqwyilddcstjp.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_Bm0o2tTcGPgDQ4L3qM0DvA_ve2XzJXw";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    const form =
        document.getElementById("registerForm");

    const message =
        document.getElementById("message");


    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const name =
                document.getElementById("name").value.trim();


            const email =
                document.getElementById("email").value.trim();


            const password =
                document.getElementById("password").value;


            message.textContent =
                "Creating your account...";


            const { data, error } =
                await supabase.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {
                            full_name: name
                        }

                    }

                });


            if (error) {

                message.textContent =
                    "Error: " + error.message;

                return;

            }


            message.textContent =
                "Account created! Check your email to confirm your account.";

            form.reset();

        }

    );

</script>

</body>

</html>
