<body>

<div class="login-container">

    <div class="logo">
        Bright English Academy
    </div>

    <div class="subtitle">
        Speak English with Confidence
    </div>

    <h1>
        Student Login
    </h1>

    <form id="loginForm">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <label for="password">
            Password
        </label>

        <div class="password-wrapper">

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button
                type="button"
                id="togglePassword"
                class="toggle-password"
                aria-label="Show password">

                👁️

            </button>

        </div>

        <button
            type="submit"
            id="loginButton"
            class="login-button">

            Login

        </button>

    </form>

    <div id="message"></div>

    <div class="links">

        <p>

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </p>

        <p>

            <a href="forgot-password.html">
                Forgot Password?
            </a>

        </p>

        <a
            href="index.html"
            class="home-link">

            ← Back to Home

        </a>

    </div>

</div>

<script type="module">

    import {
        createClient
    }
    from
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    const SUPABASE_URL =
        "https://atjyyhlqqwyilddcstjp.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_Bm0o2tTcGPgDQ4L3qM0DvA_ve2XzJXw";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    const loginForm =
        document.getElementById(
            "loginForm"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    const message =
        document.getElementById(
            "message"
        );


    const password =
        document.getElementById(
            "password"
        );


    const togglePassword =
        document.getElementById(
            "togglePassword"
        );


    /* SHOW / HIDE PASSWORD */

    togglePassword.addEventListener(
        "click",
        function() {

            if (
                password.type ===
                "password"
            ) {

                password.type =
                    "text";

                togglePassword.textContent =
                    "🙈";

                togglePassword.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            } else {

                password.type =
                    "password";

                togglePassword.textContent =
                    "👁️";

                togglePassword.setAttribute(
                    "aria-label",
                    "Show password"
                );

            }

        }
    );


    /* LOGIN */

    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document
                .getElementById("email")
                .value
                .trim();


            const passwordValue =
                password.value;


            loginButton.disabled =
                true;

            loginButton.textContent =
                "Signing in...";


            message.className = "";

            message.textContent =
                "Checking your account...";


            try {

                const {
                    data,
                    error
                } =
                await supabase.auth
                .signInWithPassword({

                    email:
                        email,

                    password:
                        passwordValue

                });


                if (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    message.className =
                        "error";


                    if (
                        error.message
                        .toLowerCase()
                        .includes(
                            "email not confirmed"
                        )
                    ) {

                        message.textContent =
                            "Please confirm your email before logging in.";

                    } else {

                        message.textContent =
                            "Login failed: " +
                            error.message;

                    }


                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Login";

                    return;
                }


                if (!data.session) {

                    message.className =
                        "error";

                    message.textContent =
                        "Login completed, but no session was created.";

                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Login";

                    return;
                }


                message.className =
                    "success";

                message.textContent =
                    "Login successful! Welcome to Bright English Academy.";


                /*
                 * Give Supabase a moment
                 * to save the session.
                 */

                setTimeout(
                    function() {

                        window.location.href =
                            "student-dashboard.html";

                    },
                    800
                );

            }

            catch (error) {

                console.error(
                    "Unexpected error:",
                    error
                );


                message.className =
                    "error";

                message.textContent =
                    "Something went wrong. Please try again.";


                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login";

            }

        }
    );

</script>

</body>

</html>
