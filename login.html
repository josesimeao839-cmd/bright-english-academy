<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Student login for Bright English Academy.">

    <title>Student Login | Bright English Academy</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0b4f9c,
                    #1d78d4
                );

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        .login-container {

            width: 100%;

            max-width: 430px;

            background: white;

            padding: 40px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.20);
        }


        .logo {

            text-align: center;

            font-size: 28px;

            font-weight: bold;

            color: #0b4f9c;

            margin-bottom: 10px;
        }


        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 30px;
        }


        h1 {

            text-align: center;

            color: #222;

            font-size: 25px;

            margin-bottom: 25px;
        }


        label {

            display: block;

            margin-top: 18px;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }


        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }


        input:focus {

            border-color: #0b4f9c;

            box-shadow:
                0 0 0 2px
                rgba(11, 79, 156, 0.10);
        }


        /* PASSWORD */

        .password-wrapper {

            position: relative;

            width: 100%;
        }


        .password-wrapper input {

            padding-right: 50px;
        }


        .toggle-password {

            position: absolute;

            right: 8px;

            top: 50%;

            transform:
                translateY(-50%);

            width: auto;

            margin: 0;

            padding: 7px;

            border: none;

            background: transparent;

            color: #0b4f9c;

            font-size: 20px;

            cursor: pointer;

            box-shadow: none;
        }


        .toggle-password:hover {

            background: transparent;

            color: #083b75;
        }


        /* LOGIN BUTTON */

        .login-button {

            width: 100%;

            padding: 14px;

            margin-top: 25px;

            border: none;

            border-radius: 8px;

            background: #0b4f9c;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .login-button:hover {

            background: #083b75;
        }


        .login-button:disabled {

            background: #999;

            cursor: not-allowed;
        }


        /* MESSAGE */

        #message {

            margin-top: 20px;

            text-align: center;

            font-weight: bold;

            line-height: 1.5;
        }


        .success {

            color: #16803c;
        }


        .error {

            color: #c62828;
        }


        /* LINKS */

        .links {

            text-align: center;

            margin-top: 25px;
        }


        .links p {

            color: #555;
        }


        .links a {

            color: #0b4f9c;

            text-decoration: none;

            font-weight: bold;
        }


        .links a:hover {

            text-decoration: underline;
        }


        .home-link {

            display: block;

            margin-top: 15px;

            color: #666 !important;

            font-weight: normal !important;
        }


        /* MOBILE */

        @media (max-width: 500px) {

            .login-container {

                padding: 30px 22px;
            }


            .logo {

                font-size: 24px;
            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="logo">

        Bright English Academy

    </div>


    <div class="subtitle">

        Speak English with Confidence

    </div>


    <h1>

        Student Login

    </h1>


    <form id="loginForm">


        <!-- EMAIL -->

        <label for="email">

            Email

        </label>


        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >


        <!-- PASSWORD -->

        <label for="password">

            Password

        </label>


        <div class="password-wrapper">

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >


            <button
                type="button"
                id="togglePassword"
                class="toggle-password"
                aria-label="Show password">

                👁️

            </button>

        </div>


        <!-- LOGIN -->

        <button
            type="submit"
            id="loginButton"
            class="login-button">

            Login

        </button>


    </form>


    <!-- MESSAGE -->

    <div id="message"></div>


    <!-- LINKS -->

    <div class="links">


        <p>

            Don't have an account?

            <a href="register.html">

                Create Account

            </a>

        </p>


        <a
            href="index.html"
            class="home-link">

            ← Back to Home

        </a>


    </div>


</div>


<script type="module">


    /*
     * SUPABASE
     */

    import {
        createClient
    }

    from
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    /*
     * PROJECT URL
     */

    const SUPABASE_URL =
        "https://atjyyhlqqwyilddcstjp.supabase.co";


    /*
     * PUBLISHABLE KEY
     *
     * COLOQUE AQUI A SUA
     * PUBLISHABLE KEY.
     *
     * NÃO coloque Secret Key.
     */

    const SUPABASE_KEY =
        "sb_publishable_Bm0o2tTcGPgDQ4L3qM0DvA_ve2XzJXw";


    /*
     * CREATE SUPABASE CLIENT
     */

    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /*
     * ELEMENTS
     */

    const loginForm =
        document.getElementById(
            "loginForm"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    const message =
        document.getElementById(
            "message"
        );


    const password =
        document.getElementById(
            "password"
        );


    const togglePassword =
        document.getElementById(
            "togglePassword"
        );


    /*
     * SHOW / HIDE PASSWORD
     */

    togglePassword.addEventListener(
        "click",
        function() {


            if (
                password.type ===
                "password"
            ) {


                password.type =
                    "text";


                togglePassword.textContent =
                    "🙈";


                togglePassword.setAttribute(
                    "aria-label",
                    "Hide password"
                );


            }

            else {


                password.type =
                    "password";


                togglePassword.textContent =
                    "👁️";


                togglePassword.setAttribute(
                    "aria-label",
                    "Show password"
                );

            }

        }
    );


    /*
     * LOGIN
     */

    loginForm.addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();


            const email =
                document
                .getElementById("email")
                .value
                .trim();


            const passwordValue =
                password.value;


            /*
             * LOADING
             */

            loginButton.disabled =
                true;


            loginButton.textContent =
                "Signing in...";


            message.className = "";


            message.textContent =
                "Checking your account...";


            /*
             * SUPABASE LOGIN
             */

            const {
                data,
                error
            } =
            await supabase.auth
            .signInWithPassword({

                email:
                    email,

                password:
                    passwordValue

            });


            /*
             * ERROR
             */

            if (error) {


                console.error(
                    "Login error:",
                    error
                );


                message.className =
                    "error";


                if (
                    error.message
                    .toLowerCase()
                    .includes(
                        "email not confirmed"
                    )
                ) {


                    message.textContent =
                        "Please confirm your email before logging in.";


                }

                else {


                    message.textContent =
                        "Login failed: " +
                        error.message;

                }


                loginButton.disabled =
                    false;


                loginButton.textContent =
                    "Login";


                return;

            }


            /*
             * SUCCESS
             */

            message.className =
                "success";


            message.textContent =
                "Login successful! Welcome to Bright English Academy.";


            /*
             * TEMPORARY REDIRECT
             *
             * Later we will create
             * the Student Dashboard.
             */

setTimeout(
    function() {

        window.location.href =
            "student-dashboard.html";

    },
    1200
);
            );


        }
    );


</script>


</body>

</html>
